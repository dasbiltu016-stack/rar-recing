name: Build Full Android APK and AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Extract ZIP
      run: |
        mkdir -p extracted_project
        unzip -q "*.zip" -d extracted_project
        if [ $(ls -1 extracted_project | wc -l) -eq 1 ] && [ -d "extracted_project/$(ls -1 extracted_project)" ]; then
          SUB=$(ls -1 extracted_project)
          mv extracted_project/"$SUB"/* extracted_project/ 2>/dev/null || true
          mv extracted_project/"$SUB"/.* extracted_project/ 2>/dev/null || true
          rmdir extracted_project/"$SUB" 2>/dev/null || true
        fi

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Node.js and Install Dependencies
      run: |
        cd extracted_project
        if [ -f "package.json" ]; then
          npm install --legacy-peer-deps || true
          npm run build || true
          npx cap sync android || true
        fi

    - name: Build APK and Release AAB
      run: |
        GRADLEW_PATH=$(find extracted_project -name "gradlew" | head -n 1)
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        echo "Building in: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        chmod +x gradlew
        ./gradlew assembleDebug bundleRelease --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v7
      with:
        name: app-debug-apk
        path: extracted_project/**/build/outputs/apk/debug/*.apk
        archive: false

    - name: Upload AAB Artifact
      uses: actions/upload-artifact@v7
      with:
        name: app-release-aab
        path: extracted_project/**/build/outputs/bundle/release/*.aab
        archive: false
