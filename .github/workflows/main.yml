name: Build APK and AAB (Auto-Find)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Extract and Inspect ZIP
      run: |
        mkdir -p extracted_project
        unzip -q "*.zip" -d extracted_project
        echo "=== ZIP এর ভেতরের ফাইল লিস্ট ==="
        find extracted_project -maxdepth 3

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build APK and Release AAB
      run: |
        GRADLEW_PATH=$(find extracted_project -name "gradlew" | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "ERROR: এই ZIP ফাইলের ভেতরে কোনো Android Studio (gradlew) প্রজেক্ট নেই!"
          exit 1
        fi
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        echo "Project found at: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        chmod +x gradlew
        ./gradlew assembleDebug bundleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v7
      with:
        name: app-debug-apk
        path: extracted_project/**/build/outputs/apk/debug/*.apk
        archive: false

    - name: Upload AAB Artifact
      uses: actions/upload-artifact@v7
      with:
        name: app-release-aab
        path: extracted_project/**/build/outputs/bundle/release/*.aab
        archive: false
