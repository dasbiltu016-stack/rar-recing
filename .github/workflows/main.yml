name: Build APK and AAB (Latest)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Extract ZIP file automatically
      run: |
        mkdir -p extracted_project
        unzip -q "*.zip" -d extracted_project
        cd extracted_project
        if [ $(ls -1 | wc -l) -eq 1 ] && [ -d "$(ls -1)" ]; then
          FOLDER=$(ls -1)
          mv "$FOLDER"/* . 2>/dev/null || true
          mv "$FOLDER"/.* . 2>/dev/null || true
          rmdir "$FOLDER" 2>/dev/null || true
        fi

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build APK and Release AAB
      working-directory: ./extracted_project
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug bundleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v7
      with:
        name: app-debug-apk
        path: extracted_project/app/build/outputs/apk/debug/*.apk
        archive: false

    - name: Upload AAB Artifact
      uses: actions/upload-artifact@v7
      with:
        name: app-release-aab
        path: extracted_project/app/build/outputs/bundle/release/*.aab
        archive: false
